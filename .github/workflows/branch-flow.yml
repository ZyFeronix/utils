name: Branch flow

# Reusable: enforces the promotion path work branches -> dev -> beta -> main.
# Call it from a `pull_request` workflow (branches: [main, beta, dev]).

on: workflow_call

permissions:
  contents: read

jobs:
  validate:
    name: Promotion path
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Check source and target branches
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          case "$BASE" in
            dev)
              case "$HEAD" in
                main|beta) echo "::error::main and beta cannot open PRs into dev. Open a work branch against dev instead."; exit 1 ;;
              esac ;;
            beta)
              [ "$HEAD" = dev ] || { echo "::error::Only dev can be promoted to beta. Received source: $HEAD."; exit 1; } ;;
            main)
              [ "$HEAD" = beta ] || { echo "::error::Only beta can be promoted to main. Received source: $HEAD."; exit 1; } ;;
            *) echo "Base branch has no rules: $BASE" ;;
          esac
          echo "Valid path: $HEAD -> $BASE"
